<title>Laboratório de Estruturas de Dados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: bancada de laboratório. Cabeçalho com curso (ADS/EC) e abas; palco de animação à esquerda, código C com linhas acesas à direita. */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --ink:#14203f; --muted:#5a6785; --line:#d5dbe8;
  --navy:#1f2a5c; --accent:#0f8b8d; --accent-ink:#ffffff; --hot:#e08a00; --hot-bg:#fff1d6;
  --ok:#17803d; --bad:#c0392b; --code-bg:#101a38; --code-ink:#dfe6fb; --code-hl:#2a3f86;
  --cell:#eaf0fb; --cell-line:#9db0dc;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226; --panel:#131d3b; --ink:#e7ecfb; --muted:#9aa8cc; --line:#27345f;
  --navy:#8fa4ff; --accent:#2cc4c6; --accent-ink:#06223a; --hot:#ffb03a; --hot-bg:#3a2d10;
  --ok:#4cd081; --bad:#ff7a6b; --code-bg:#0a1130; --code-ink:#dfe6fb; --code-hl:#2a3f86;
  --cell:#1a2850; --cell-line:#3d5199; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1226; --panel:#131d3b; --ink:#e7ecfb; --muted:#9aa8cc; --line:#27345f;
  --navy:#8fa4ff; --accent:#2cc4c6; --accent-ink:#06223a; --hot:#ffb03a; --hot-bg:#3a2d10;
  --ok:#4cd081; --bad:#ff7a6b; --code-bg:#0a1130; --code-ink:#dfe6fb; --code-hl:#2a3f86;
  --cell:#1a2850; --cell-line:#3d5199; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--font-d);font-size:clamp(1.4rem,3.4vw,2rem);margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--font-b);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--font-b);padding:9px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.lab{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.lab{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--font-d);font-size:1.05rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctrl input{width:90px;font:600 15px var(--font-m);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{border:1px solid var(--navy);background:transparent;color:var(--navy);font:600 13px var(--font-b);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.p{background:var(--navy);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{min-height:250px;border:1px dashed var(--line);border-radius:8px;padding:14px;overflow-x:auto;display:flex;align-items:center;justify-content:center}
.log{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;min-height:3.2em}
.log.err{border-color:var(--bad)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font:600 12px var(--font-m);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge b{color:var(--ink)}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:10px 0;font:13px/1.55 var(--font-m);overflow-x:auto}
pre.code span{display:block;padding:0 14px;white-space:pre;border-left:3px solid transparent}
pre.code span.hl{background:var(--code-hl);border-left-color:var(--hot)}
.note{margin-top:12px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.cell{font:600 15px var(--font-m);background:var(--cell);border:2px solid var(--cell-line);border-radius:6px;padding:8px 12px;text-align:center;min-width:64px;transition:background .2s,border-color .2s,transform .2s}
.cell small{display:block;font:400 11px var(--font-m);color:var(--muted)}
.cell.hot{background:var(--hot-bg);border-color:var(--hot);transform:scale(1.06)}
.cell.found{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.found small{color:var(--accent-ink)}
.cell.in{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.cell.empty{background:transparent;border-style:dashed;color:var(--muted)}
.tag{font:600 11px var(--font-m);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:6px;align-items:center}
.stack .row{display:flex;align-items:center;gap:10px}
.row .tag{width:52px;text-align:right}
.queue{display:flex;gap:6px}
.queue .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;justify-content:flex-end}
.chain{display:flex;align-items:center;gap:0}
.arrow{color:var(--muted);font:600 18px var(--font-m);padding:0 4px}
.node{display:flex;border:2px solid var(--cell-line);border-radius:6px;background:var(--cell);font:600 14px var(--font-m);transition:background .2s,border-color .2s,transform .2s}
.node .v{padding:8px 12px}.node .n{padding:8px 10px;border-left:2px solid var(--cell-line);color:var(--muted)}
.node.hot{background:var(--hot-bg);border-color:var(--hot);transform:scale(1.06)}
.node.found{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node.found .n{color:var(--accent-ink)}
.node small{display:block;font:400 10px var(--font-m);color:var(--muted)}
.list-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hashrow{display:flex;align-items:center;gap:8px;margin:3px 0}
.hashrow .idx{font:600 13px var(--font-m);width:34px;text-align:center;padding:8px 0;border-radius:6px;background:var(--navy);color:var(--bg)}
.hashrow .idx.hot{background:var(--hot);color:#000}
.hashrow .mini{font:600 13px var(--font-m);padding:6px 10px;border:2px solid var(--cell-line);border-radius:6px;background:var(--cell)}
.hashrow .mini.hot{background:var(--hot-bg);border-color:var(--hot)}
.hashrow .mini.found{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
svg text{font:600 13px var(--font-m);fill:var(--ink)}
svg .n circle{fill:var(--cell);stroke:var(--cell-line);stroke-width:2;transition:fill .2s,stroke .2s}
svg .n.hot circle{fill:var(--hot-bg);stroke:var(--hot)}
svg .n.found circle{fill:var(--accent);stroke:var(--accent)}
svg .n.found text{fill:var(--accent-ink)}
svg line{stroke:var(--cell-line);stroke-width:2}
.out{font:600 14px var(--font-m);margin-top:8px;min-height:1.6em;color:var(--accent)}
body[data-curso="ads"] .ec-only,body[data-curso="ec"] .ads-only{display:none}
.q{display:flex;flex-direction:column;gap:12px}
.q .tagrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:8px;font:500 14px var(--font-b);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.score{font:600 14px var(--font-m)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.why{padding:10px 12px;background:var(--bg);border-radius:8px;border-left:4px solid var(--navy)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Laboratório de Estruturas de Dados</h1>
      <p class="sub">Empilhe, enfileire, encadeie e ordene na prática. Cada operação roda passo a passo e acende a linha do código C que a executa.</p>
    </div>
    <div class="seg" role="group" aria-label="Curso">
      <button id="c-ads" aria-pressed="true" type="button">ADS</button>
      <button id="c-ec" aria-pressed="false" type="button">Eng. da Computação</button>
    </div>
  </header>
  <nav id="tabs" role="tablist" aria-label="Estruturas"></nav>
  <main id="view"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms*(window.__fast?0.01:1))})};
var curso='ads';
function setCurso(c){curso=c;document.body.setAttribute('data-curso',c);
  $('#c-ads').setAttribute('aria-pressed',c==='ads');$('#c-ec').setAttribute('aria-pressed',c==='ec');
  if(cur&&cur.onCurso)cur.onCurso();}
$('#c-ads').onclick=function(){setCurso('ads')};
$('#c-ec').onclick=function(){setCurso('ec')};
document.body.setAttribute('data-curso','ads');

var uid=0;function addr(){uid++;return '0x'+(0x7f00+uid*24+Math.floor(Math.random()*3)*8).toString(16).toUpperCase()}
function codeHTML(lines,hl){return lines.map(function(l,i){return '<span'+(hl&&hl.indexOf(i)>=0?' class="hl"':'')+'>'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+' </span>'}).join('')}
function badges(a){return a.map(function(b){return '<span class="badge">'+b[0]+' <b>'+b[1]+'</b></span>'}).join('')}

/* Painel padrão de um laboratório */
function shell(o){
  return '<div class="lab"><section class="card"><h2>'+o.title+'</h2><p class="lead">'+o.lead+'</p>'+
  '<div class="ctrl">'+o.ctrl+'</div><div class="stage" id="stage"></div><div class="out" id="out"></div>'+
  '<div class="log" id="log" aria-live="polite">Pronto. Escolha uma operação.</div><div class="badges" id="bd"></div></section>'+
  '<section class="card"><h2>Código em C</h2><p class="lead" id="codeop">Selecione uma operação para ver a linha executada.</p><pre class="code" id="code" aria-label="Código C"></pre>'+
  '<p class="note ads-only">'+o.ads+'</p><p class="note ec-only">'+o.ec+'</p></section></div>';
}
var busy=false;
function lock(v){busy=v;document.querySelectorAll('#view .btn').forEach(function(b){b.disabled=v})}
function log(t,err){var l=$('#log');l.textContent=t;l.className='log'+(err?' err':'')}
function showCode(lines,hl,op){$('#code').innerHTML=codeHTML(lines,hl);if(op)$('#codeop').textContent=op}
function readNum(){var v=parseInt($('#val').value,10);if(isNaN(v)){log('Digite um número inteiro na caixa antes de operar.',true);return null}return v}

/* ============ PILHA ============ */
var Pilha=(function(){
  var MAX=6,d=[],last=-1;
  var C=['#define MAX 6','typedef struct { int dados[MAX]; int topo; } Pilha;','','void push(Pilha *p, int v){','  if (p->topo == MAX-1) return;   // cheia','  p->dados[++p->topo] = v;','}','','int pop(Pilha *p){','  if (p->topo == -1) return -1;   // vazia','  return p->dados[p->topo--];','}','','int peek(Pilha *p){ return p->dados[p->topo]; }'];
  function draw(hot){
    var h='<div class="stack">';
    for(var i=MAX-1;i>=0;i--){
      var has=i<d.length,top=i===d.length-1;
      h+='<div class="row"><span class="tag">'+(top?'topo →':(has?'':''))+'</span><div class="cell'+(has?'':' empty')+(hot===i?' hot':'')+(last===i?' in':'')+'">'+(has?d[i]:'vazio')+'<small class="ec-only">dados['+i+'] · 0x'+(0x1000+i*4).toString(16).toUpperCase()+'</small></div></div>';
    }
    $('#stage').innerHTML=h+'</div>';last=-1;
    $('#bd').innerHTML=badges([['elementos',d.length+'/'+MAX],['topo',d.length-1]]);
  }
  async function push(){if(busy)return;var v=readNum();if(v===null)return;
    showCode(C,[3,4,5],'push: insere no topo');
    if(d.length===MAX){log('Pilha cheia (topo == MAX-1). Em C, isso é um overflow: o push é ignorado.',true);return}
    d.push(v);last=d.length-1;draw();log('push('+v+'): topo passou de '+(d.length-2)+' para '+(d.length-1)+' e o valor foi gravado em dados['+(d.length-1)+'].');
    $('#bd').innerHTML+=badges([['custo','O(1)']]);}
  async function pop(){if(busy)return;showCode(C,[8,9,10],'pop: remove do topo');
    if(!d.length){log('Pilha vazia (topo == -1). Em C, o pop devolve um valor de erro.',true);return}
    lock(true);draw(d.length-1);await sleep(450);var v=d.pop();draw();lock(false);
    log('pop() devolveu '+v+' (o último que entrou é o primeiro a sair: LIFO). topo agora é '+(d.length-1)+'.');$('#bd').innerHTML+=badges([['custo','O(1)']]);}
  function peek(){showCode(C,[13],'peek: consulta sem remover');if(!d.length){log('Nada para espiar: pilha vazia.',true);return}
    draw(d.length-1);log('peek() = '+d[d.length-1]+'. O topo não mudou.');}
  function clear(){d=[];draw();log('Pilha esvaziada (topo = -1).');showCode(C,[]);}
  return {title:'Pilha (LIFO)',mount:function(){
    $('#view').innerHTML=shell({title:'Pilha (LIFO)',lead:'O último que entra é o primeiro que sai. Pense em pratos empilhados ou no Ctrl+Z.',
      ctrl:'<input id="val" type="number" value="7" aria-label="Valor"><button class="btn p" id="b1">push</button><button class="btn" id="b2">pop</button><button class="btn" id="b3">peek</button><button class="btn" id="b4">limpar</button>',
      ads:'<b>No sistema:</b> desfazer/refazer em editores, histórico do botão voltar do navegador e a pilha de chamadas das funções recursivas usam esta estrutura.',
      ec:'<b>Na memória:</b> vetor estático de 6 inteiros (4 bytes cada, endereços consecutivos). A pilha de chamadas do processador também cresce e encolhe pelo topo.'});
    $('#b1').onclick=push;$('#b2').onclick=pop;$('#b3').onclick=peek;$('#b4').onclick=clear;
    d=[3,8];draw();showCode(C,[]);log('Exemplo carregado com 3 e 8. Experimente empilhar até estourar.');},onCurso:function(){}};
})();

/* ============ FILA (circular) ============ */
var Fila=(function(){
  var N=6,a=[],ini=0,cnt=0,lastIn=-1;
  var C=['#define N 6','typedef struct { int v[N]; int ini, n; } Fila;','','void enqueue(Fila *f, int x){','  if (f->n == N) return;                // cheia','  f->v[(f->ini + f->n) % N] = x;','  f->n++;','}','','int dequeue(Fila *f){','  if (f->n == 0) return -1;             // vazia','  int x = f->v[f->ini];','  f->ini = (f->ini + 1) % N;  f->n--;','  return x;','}'];
  function draw(hot){
    var fim=cnt?(ini+cnt-1)%N:-1,h='<div class="queue">';
    for(var i=0;i<N;i++){var has=false;for(var k=0;k<cnt;k++)if((ini+k)%N===i)has=true;
      h+='<div class="col"><span class="tag">'+(has&&i===ini?'início':'')+(has&&i===fim?(i===ini?' / ':'')+'fim':'')+'</span><div class="cell'+(has?'':' empty')+(hot===i?' hot':'')+(lastIn===i?' in':'')+'">'+(has?a[i]:'—')+'<small>['+i+']</small></div></div>';}
    $('#stage').innerHTML=h+'</div>';lastIn=-1;
    $('#bd').innerHTML=badges([['n',cnt+'/'+N],['ini',ini],['próx. posição','(ini+n)%N = '+((ini+cnt)%N)]]);
  }
  function enq(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[3,4,5,6],'enqueue: entra no fim');
    if(cnt===N){log('Fila cheia (n == N). O enqueue é ignorado.',true);return}
    var p=(ini+cnt)%N;a[p]=v;cnt++;lastIn=p;draw();log('enqueue('+v+'): posição = (ini + n) % N = ('+ini+' + '+(cnt-1)+') % '+N+' = '+p+'.');$('#bd').innerHTML+=badges([['custo','O(1)']]);}
  async function deq(){if(busy)return;showCode(C,[9,10,11,12,13],'dequeue: sai do início');
    if(!cnt){log('Fila vazia (n == 0).',true);return}
    lock(true);draw(ini);await sleep(450);var v=a[ini];var old=ini;ini=(ini+1)%N;cnt--;draw();lock(false);
    log('dequeue() devolveu '+v+' (primeiro a entrar, primeiro a sair: FIFO). ini = ('+old+' + 1) % '+N+' = '+ini+'. Ao chegar no fim do vetor, o índice volta ao 0.');$('#bd').innerHTML+=badges([['custo','O(1)']]);}
  function clear(){a=[];ini=0;cnt=0;draw();log('Fila esvaziada.');showCode(C,[]);}
  return {mount:function(){
    $('#view').innerHTML=shell({title:'Fila circular (FIFO)',lead:'Quem chega primeiro é atendido primeiro. O vetor é circular: o fim dá a volta e reaproveita as posições livres.',
      ctrl:'<input id="val" type="number" value="5" aria-label="Valor"><button class="btn p" id="b1">enqueue</button><button class="btn" id="b2">dequeue</button><button class="btn" id="b4">limpar</button>',
      ads:'<b>No sistema:</b> fila de impressão, fila de requisições de um servidor web e mensagens em filas de mensageria (processadas na ordem de chegada).',
      ec:'<b>Na memória:</b> buffer circular de tamanho fixo, usado em drivers, UART e comunicação entre tarefas de sistemas embarcados. O módulo (%) evita mover os elementos.'});
    $('#b1').onclick=enq;$('#b2').onclick=deq;$('#b4').onclick=clear;
    a=[];ini=0;cnt=0;[4,9,2].forEach(function(x){a[(ini+cnt)%N]=x;cnt++});draw();showCode(C,[]);log('Exemplo carregado com 4, 9 e 2. Faça dequeue e enqueue várias vezes e acompanhe o índice dar a volta.');}};
})();

/* ============ LISTA ENCADEADA ============ */
var Lista=(function(){
  var L=[];
  var C=['typedef struct No { int v; struct No *prox; } No;','','No* inserir_inicio(No *h, int x){','  No *n = malloc(sizeof(No));','  n->v = x;  n->prox = h;','  return n;                    // nova cabeça','}','','No* buscar(No *h, int x){','  for (No *p = h; p != NULL; p = p->prox)','    if (p->v == x) return p;','  return NULL;','}','','void inserir_fim(No *h, int x){','  while (h->prox != NULL) h = h->prox;','  h->prox = novo(x);','}'];
  function node(v){return {v:v,a:addr()}}
  function draw(hot,found){
    var h='<div class="list-wrap"><span class="tag">cabeça</span><div class="chain">';
    if(!L.length)h+='<div class="cell empty">NULL</div>';
    L.forEach(function(n,i){h+='<div class="node'+(hot===i?' hot':'')+(found===i?' found':'')+'"><div class="v">'+n.v+'<small class="ec-only">'+n.a+'</small></div><div class="n">'+(i<L.length-1?'●':'NULL')+'</div></div>'+(i<L.length-1?'<span class="arrow">→</span>':'');});
    $('#stage').innerHTML=h+'</div></div>';
    $('#bd').innerHTML=badges([['nós',L.length]]);
  }
  function ini(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[2,3,4,5],'inserir no início');
    L.unshift(node(v));draw(0);log('Novo nó criado com malloc. prox aponta para a antiga cabeça e a cabeça passa a ser o novo nó. Nenhum elemento foi movido.');$('#bd').innerHTML+=badges([['custo','O(1)']]);}
  async function fim(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[14,15,16],'inserir no fim');
    lock(true);for(var i=0;i<L.length;i++){draw(i);await sleep(300)}L.push(node(v));draw(L.length-1);lock(false);
    log('Foi preciso percorrer '+(L.length-1)+' nó(s) até o último para ligar o novo. Sem ponteiro para a cauda, inserir no fim custa O(n).');$('#bd').innerHTML+=badges([['custo','O(n)']]);}
  async function buscar(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[8,9,10,11],'buscar um valor');
    lock(true);var f=-1;for(var i=0;i<L.length;i++){draw(i);await sleep(380);if(L[i].v===v){f=i;break}}

/* ============ ÁRVORE BINÁRIA DE BUSCA ============ */
var Arvore=(function(){
  var root=null,ids=0;
  var C=['typedef struct No { int v; struct No *esq, *dir; } No;','','No* inserir(No *r, int x){','  if (r == NULL) return novo(x);','  if (x < r->v) r->esq = inserir(r->esq, x);','  else if (x > r->v) r->dir = inserir(r->dir, x);','  return r;','}','','No* buscar(No *r, int x){','  if (r == NULL || r->v == x) return r;','  return x < r->v ? buscar(r->esq, x) : buscar(r->dir, x);','}','','void em_ordem(No *r){','  if (!r) return;','  em_ordem(r->esq);  visita(r);  em_ordem(r->dir);','}'];
  function size(r){return r?1+size(r.l)+size(r.r):0}
  function height(r){return r?1+Math.max(height(r.l),height(r.r)):0}
  function draw(hl,found){
    var pos=[],k=0;
    (function walk(r,dp){if(!r)return;walk(r.l,dp+1);pos.push({n:r,x:k++,y:dp});walk(r.r,dp+1)})(root,0);
    if(!root){$('#stage').innerHTML='<div class="cell empty">árvore vazia (raiz = NULL)</div>';$('#bd').innerHTML=badges([['nós',0]]);return}
    var W=Math.max(k*46+30,320),H=(height(root))*58+20,m={};pos.forEach(function(p){m[p.n.id]=p});
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Árvore binária de busca">';
    pos.forEach(function(p){[p.n.l,p.n.r].forEach(function(c){if(c){var q=m[c.id];s+='<line x1="'+(p.x*46+30)+'" y1="'+(p.y*58+26)+'" x2="'+(q.x*46+30)+'" y2="'+(q.y*58+26)+'"/>'}})});
    pos.forEach(function(p){var cls='n'+(hl&&hl.indexOf(p.n.id)>=0?' hot':'')+(found===p.n.id?' found':'');
      s+='<g class="'+cls+'"><circle cx="'+(p.x*46+30)+'" cy="'+(p.y*58+26)+'" r="18"/><text x="'+(p.x*46+30)+'" y="'+(p.y*58+31)+'" text-anchor="middle">'+p.n.v+'</text></g>'});
    $('#stage').innerHTML=s+'</svg>';
    var h=height(root),n=size(root);
    $('#bd').innerHTML=badges([['nós',n],['altura',h],['melhor caso','⌈log₂(n+1)⌉ = '+Math.ceil(Math.log2(n+1))]]);
  }
  async function ins(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[2,3,4,5,6],'inserir (recursivo)');
    if(size(root)>=15){log('Limite de 15 nós neste laboratório para a figura caber na tela.',true);return}
    lock(true);var path=[],r=root,dup=false;
    while(r){path.push(r.id);draw(path);await sleep(380);if(v===r.v){dup=true;break}r=v<r.v?r.l:r.r}
    if(dup){draw();log('Valor '+v+' já existe: a árvore não guarda duplicatas.',true);lock(false);return}
    var nn={v:v,id:++ids,l:null,r:null};
    if(!root)root=nn;else{var p=root;while(true){if(v<p.v){if(!p.l){p.l=nn;break}p=p.l}else{if(!p.r){p.r=nn;break}p=p.r}}}
    draw([nn.id]);lock(false);
    log('Caminho de '+path.length+' comparação(ões): menor vai para a esquerda, maior para a direita. '+v+' virou folha.');$('#bd').innerHTML+=badges([['custo','O(h)']]);}
  async function bus(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[9,10,11],'buscar (recursivo)');
    lock(true);var path=[],r=root,f=null;
    while(r){path.push(r.id);draw(path);await sleep(380);if(v===r.v){f=r;break}r=v<r.v?r.l:r.r}
    if(f){draw(null,f.id);log('Achou '+v+' em '+path.length+' comparação(ões). Cada passo descarta metade da árvore, se ela for equilibrada.')}else{draw();log(v+' não está na árvore ('+path.length+' comparações até NULL).',true)}
    lock(false);$('#bd').innerHTML+=badges([['custo','O(h)']]);}
  async function trav(kind){if(busy||!root)return;
    var out=[];(function w(r){if(!r)return;if(kind==='pre')out.push(r);w(r.l);if(kind==='in')out.push(r);w(r.r);if(kind==='pos')out.push(r)})(root);
    showCode(C,kind==='in'?[14,15,16]:[],kind==='in'?'percurso em ordem':'percurso '+(kind==='pre'?'pré-ordem':'pós-ordem'));
    lock(true);var seen=[],txt=[];
    for(var i=0;i<out.length;i++){seen.push(out[i].id);txt.push(out[i].v);draw(seen);$('#out').textContent=txt.join(' , ');await sleep(420)}
    var nm={in:'Em ordem (esquerda, raiz, direita)',pre:'Pré-ordem (raiz, esquerda, direita)',pos:'Pós-ordem (esquerda, direita, raiz)'}[kind];
    log(nm+': '+txt.join(', ')+(kind==='in'?'. Em ordem sempre devolve os valores ordenados.':'.'));lock(false);}
  function sample(arr){root=null;ids=0;arr.forEach(function(v){var nn={v:v,id:++ids,l:null,r:null};if(!root){root=nn;return}var p=root;while(true){if(v<p.v){if(!p.l){p.l=nn;break}p=p.l}else{if(!p.r){p.r=nn;break}p=p.r}}});$('#out').textContent='';draw();}
  return {mount:function(){
    $('#view').innerHTML=shell({title:'Árvore binária de busca',lead:'Menores à esquerda, maiores à direita. Buscar, inserir e percorrer seguem o mesmo caminho.',
      ctrl:'<input id="val" type="number" value="45" aria-label="Valor"><button class="btn p" id="b1">inserir</button><button class="btn" id="b2">buscar</button><button class="btn" id="t1">em ordem</button><button class="btn" id="t2">pré-ordem</button><button class="btn" id="t3">pós-ordem</button><button class="btn" id="s1">equilibrada</button><button class="btn" id="s2">degenerada</button>',
      ads:'<b>No sistema:</b> índices de bancos de dados, dicionários ordenados e autocompletar. Teste "degenerada": inserir valores já ordenados transforma a árvore numa lista e a busca vira O(n).',
      ec:'<b>Na memória:</b> cada nó tem 1 valor e 2 ponteiros. Com n nós equilibrados a altura é cerca de log₂ n (1023 nós, 10 níveis). Árvores AVL e rubro-negras garantem esse equilíbrio.'});
    $('#b1').onclick=ins;$('#b2').onclick=bus;$('#t1').onclick=function(){trav('in')};$('#t2').onclick=function(){trav('pre')};$('#t3').onclick=function(){trav('pos')};
    $('#s1').onclick=function(){if(busy)return;sample([50,30,70,20,40,60,80]);log('Árvore equilibrada de 7 nós: altura 3. Buscar qualquer valor custa no máximo 3 comparações.')};
    $('#s2').onclick=function(){if(busy)return;sample([10,20,30,40,50,60,70]);log('Mesmos 7 valores, inseridos em ordem crescente: altura 7. A árvore virou uma lista e a busca pior caso passou a 7 comparações.',true)};
    sample([50,30,70,20,40,60,80]);showCode(C,[]);log('Exemplo carregado. Insira valores, busque e percorra a árvore.');}};
})();

/* ============ TABELA HASH ============ */
var Hash=(function(){
  var M=7,T=[];
  var C=['#define M 7','typedef struct No { int chave; struct No *prox; } No;','No *tabela[M];','','int h(int k){ return k % M; }','','void inserir(int k){','  int i = h(k);','  tabela[i] = novo(k, tabela[i]);   // encadeia no início','}','','No* buscar(int k){','  for (No *p = tabela[h(k)]; p; p = p->prox)','    if (p->chave == k) return p;','  return NULL;','}'];
  function reset(){T=[];for(var i=0;i<M;i++)T.push([])}
  function draw(hi,hot,found){
    var n=T.reduce(function(a,b){return a+b.length},0),h='<div>';
    T.forEach(function(ch,i){h+='<div class="hashrow"><div class="idx'+(hi===i?' hot':'')+'">'+i+'</div>';
      if(!ch.length)h+='<span class="tag" style="color:var(--muted)">vazio</span>';
      ch.forEach(function(k,j){h+=(j?'<span class="arrow">→</span>':'')+'<div class="mini'+(hot&&hot.i===i&&hot.j===j?' hot':'')+(found&&found.i===i&&found.j===j?' found':'')+'">'+k+'</div>'});
      h+='</div>'});
    $('#stage').innerHTML=h+'</div>';
    var col=T.filter(function(c){return c.length>1}).length;
    $('#bd').innerHTML=badges([['chaves',n],['fator de carga α',(n/M).toFixed(2)],['buckets com colisão',col]]);
  }
  async function ins(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[6,7,8,9],'inserir na tabela');
    var i=((v%M)+M)%M;lock(true);draw(i);await sleep(450);var col=T[i].length>0;T[i].unshift(v);draw(i,{i:i,j:0});lock(false);
    log('h('+v+') = '+v+' % '+M+' = '+i+'.'+(col?' Colisão! O bucket '+i+' já tinha '+(T[i].length-1)+' chave(s); a nova foi encadeada na frente.':' Bucket livre: inserção direta.'));
    $('#bd').innerHTML+=badges([['custo médio','O(1)']]);}
  async function bus(){if(busy)return;var v=readNum();if(v===null)return;showCode(C,[11,12,13,14],'buscar na tabela');
    var i=((v%M)+M)%M;lock(true);draw(i);await sleep(450);var f=null,steps=0;
    for(var j=0;j<T[i].length;j++){steps++;draw(i,{i:i,j:j});await sleep(380);if(T[i][j]===v){f={i:i,j:j};break}}
    if(f){draw(i,null,f);log('h('+v+') = '+i+'. Achou com '+steps+' comparação(ões) dentro do bucket. Sem varrer a tabela inteira.')}else{draw(i);log('h('+v+') = '+i+'. Bucket percorrido ('+steps+' comparação(ões)) e a chave não existe.',true)}
    lock(false);}
  function rem(){if(busy)return;var v=readNum();if(v===null)return;var i=((v%M)+M)%M,j=T[i].indexOf(v);if(j<0){log(v+' não está no bucket '+i+'.',true);return}T[i].splice(j,1);draw(i);log('Chave '+v+' removida do bucket '+i+'.');}
  function sample(a){reset();a.forEach(function(v){T[v%M].unshift(v)});draw();}
  return {mount:function(){
    $('#view').innerHTML=shell({title:'Tabela hash (encadeamento)',lead:'A função hash transforma a chave em um índice. Chaves diferentes no mesmo índice formam uma colisão e ficam numa pequena lista.',
      ctrl:'<input id="val" type="number" value="24" aria-label="Chave"><button class="btn p" id="b1">inserir</button><button class="btn" id="b2">buscar</button><button class="btn" id="b3">remover</button><button class="btn" id="b4">exemplo</button><button class="btn" id="b5">limpar</button>',
      ads:'<b>No sistema:</b> cache de resultados, dicionários e mapas (HashMap, dict) e contagem de palavras. Buscar por chave custa O(1) em média.',
      ec:'<b>Na memória:</b> o índice é calculado com k % M e vira um acesso direto ao vetor de ponteiros. Com α alto as listas crescem e o custo tende a O(n); por isso se redimensiona a tabela.'});
    $('#b1').onclick=ins;$('#b2').onclick=bus;$('#b3').onclick=rem;
    $('#b4').onclick=function(){if(busy)return;sample([10,17,24,5,12,3]);log('Exemplo: 10, 17 e 24 caem no bucket 3; 5 e 12 caem no bucket 5. Veja as colisões.')};
    $('#b5').onclick=function(){reset();draw();log('Tabela vazia.')};
    sample([10,17,24,5,12,3]);showCode(C,[]);log('Exemplo carregado. 10, 17 e 24 colidem no bucket 3. Insira outros valores e confira o índice.');}};
})();
